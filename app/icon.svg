<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="threadGrad1" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--primary-500, #877EFF)" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="threadGrad2" x1="36" y1="4" x2="4" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="20" cy="20" r="18" fill="#12141A" stroke="url(#threadGrad1)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Interlocking Thread Ribbon 1 (Loop to Center Stem) -->
  <path 
    d="M 10 14 C 10 8, 30 8, 30 14 C 30 19, 22 19, 20 21 L 20 30" 
    stroke="url(#threadGrad1)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Interlocking Thread Ribbon 2 (Cross Loop) -->
  <path 
    d="M 30 14 C 30 19, 10 19, 10 24 C 10 29, 30 29, 30 24" 
    stroke="url(#threadGrad2)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Glowing Core Accent -->
  <circle cx="20" cy="21" r="2.5" fill="#FFFFFF" filter="url(#glow)" />
</svg>
